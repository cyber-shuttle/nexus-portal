<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Custos Admin Trace View</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ============================================================
     Nexus Portal tokens (light theme) — reconstructed from spec
     ============================================================ */
  :root {
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-display: 'Manrope', 'Inter', sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'SFMono-Regular', 'Menlo', 'Cascadia Code', 'Consolas', monospace;

    /* neutral ramp (cool slate) */
    --background: #ffffff;
    --foreground: #0f172a;
    --card: #ffffff;
    --muted: #f1f5f9;
    --muted-2: #f8fafc;
    --muted-foreground: #64748b;
    --border: #e7ebf0;
    --border-strong: #d6dce4;
    --ring: #2563eb;

    /* brand */
    --brand: #2563eb;
    --brand-fg: #ffffff;
    --brand-tint: #eff4ff;
    --primary: #0f172a;
    --primary-fg: #ffffff;

    /* status: green */
    --nexus-green-50: #ecfdf3;
    --nexus-green-100: #d1fadf;
    --nexus-green-500: #16a34a;
    --nexus-green-600: #15903f;
    --nexus-green-700: #15803d;

    /* status: red */
    --nexus-red-50: #fef2f2;
    --nexus-red-100: #fee2e2;
    --nexus-red-300: #fca5a5;
    --nexus-red-500: #ef4444;
    --nexus-red-600: #dc2626;
    --nexus-red-700: #b91c1c;

    /* status: amber */
    --nexus-amber-50: #fffbeb;
    --nexus-amber-100: #fef3c7;
    --nexus-amber-500: #f59e0b;
    --nexus-amber-700: #b45309;

    /* source: blue */
    --nexus-blue-50: #eff6ff;
    --nexus-blue-500: #3b82f6;
    --nexus-blue-700: #1d4ed8;

    /* source: purple */
    --nexus-purple-50: #f5f3ff;
    --nexus-purple-500: #8b5cf6;
    --nexus-purple-700: #6d28d9;

    --shadow-sm: 0 1px 2px rgba(15,23,42,.06);
    --shadow-md: 0 4px 12px rgba(15,23,42,.08), 0 1px 3px rgba(15,23,42,.06);
    --shadow-drawer: -12px 0 40px rgba(15,23,42,.14), -2px 0 8px rgba(15,23,42,.06);

    --radius: 8px;
    --radius-sm: 6px;
    --radius-md: 10px;
    --sidebar-w: 232px;
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-sans);
    color: var(--foreground);
    background: var(--muted-2);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-size: 14px;
    line-height: 1.4;
  }
  #root { height: 100%; }

  ::selection { background: #c7dbff; }

  /* scrollbars */
  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-thumb { background: #cdd5df; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #b3bdc9; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  button { font-family: inherit; }

  :focus-visible {
    outline: 2px solid var(--ring);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .mono { font-family: var(--font-mono); }
  .display { font-family: var(--font-display); }

  /* shimmer */
  @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  .skeleton {
    background: linear-gradient(90deg, #eef1f5 25%, #f6f8fa 50%, #eef1f5 75%);
    background-size: 800px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: 5px;
  }

  @keyframes drawerIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes pulseDot { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="tree.jsx"></script>
<script type="text/babel" src="drawer.jsx"></script>
<script type="text/babel" src="list.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
